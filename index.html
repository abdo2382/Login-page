<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up — Real-time Validation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Create an account</h1>

      <form id="signupForm" novalidate>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
        <div id="emailMessage" class="message" aria-live="polite"></div>

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
        />
        <div class="strength">
          <div id="strengthBar" class="strength-bar"></div>
          <div id="strengthText" class="strength-text"></div>
        </div>
        <div id="passwordMessage" class="message" aria-live="polite"></div>

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          required
        />
        <div id="confirmMessage" class="message" aria-live="polite"></div>

        <button id="submitBtn" type="submit" disabled>Sign up</button>
        <div id="formResult" class="result" aria-live="polite"></div>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
